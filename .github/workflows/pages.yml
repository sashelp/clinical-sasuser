name: Deploy SASHELP site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare site artifact
        run: |
          mkdir -p _site/sashelp _site/codehub/macro
          cp -a sashelp/. _site/sashelp/
          cp -a codehub/macro/dev _site/codehub/macro/
          touch _site/.nojekyll
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=./sashelp/">
            <title>SAS/HELP</title>
          </head>
          <body><p><a href="./sashelp/">Open SAS/HELP</a></p></body>
          </html>
          EOF
      - name: Upload SASHELP site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
